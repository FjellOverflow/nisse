---
- name: Install workstation packages
  become: true
  ansible.builtin.dnf:
    name:
      - gparted
      - flatpak
      - fedora-third-party

- name: Add RPM Fusion repositories
  become: true
  ansible.builtin.dnf:
    name:
      - "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
      - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
    disable_gpg_check: true

- name: Install multimedia codecs
  become: true
  ansible.builtin.dnf:
    name: ffmpeg
    allowerasing: true

- name: Enable Flathub remote
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    method: user
    state: present
    enabled: true

- name: Install flatpaks
  community.general.flatpak:
    method: user
    name:
      - org.freefilesync.FreeFileSync
      - org.gimp.GIMP
      - md.obsidian.Obsidian
      - org.videolan.VLC
      - org.inkscape.Inkscape
      - com.bitwarden.desktop
      - com.spotify.Client
      - org.libreoffice.LibreOffice

- name: Remove unused flatpak runtimes
  ansible.builtin.command: flatpak uninstall --unused --user -y
  register: flatpak_unused
  changed_when: "'Nothing unused to uninstall' not in flatpak_unused.stdout"

- name: Enable Fedora third-party repositories
  become: true
  ansible.builtin.command: fedora-third-party enable
  changed_when: false
