---
- name: Assert that target_user is the connecting user
  ansible.builtin.assert:
    that: target_user == ansible_facts['user_id']
    fail_msg: "target_user is '{{ target_user }}', but this play connects as '{{ ansible_facts['user_id'] }}'."
    quiet: true

# TODO: fedora only
- name: Upgrade packages
  become: true
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_only: true


# TODO: fedora only
- name: Install base utilities
  become: true
  ansible.builtin.package:
    name:
      - bat
      - curl
      - direnv
      - git
      - gnupg2
      - nano
      - ncdu
      - tmux
      - tree
      - wget

# TODO: fedora only
- name: Install Ansible module dependencies
  become: true
  ansible.builtin.package:
    name:
      - python3-dnf # TODO: https://github.com/ansible-collections/community.general/issues/12501
      - python3-psutil

- name: Configure locale
  ansible.builtin.import_tasks: locale.yml

- name: Setup fish
  ansible.builtin.import_tasks: fish.yml

- name: Setup git
  ansible.builtin.import_tasks: git.yml

- name: Setup passwordless sudo
  ansible.builtin.import_tasks: sudo.yml
