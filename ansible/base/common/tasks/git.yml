---
- name: Set git user name
  community.general.git_config:
    name: user.name
    scope: global
    value: FjellOverflow

- name: Set git user email
  community.general.git_config:
    name: user.email
    scope: global
    value: fjelloverflow@protonmail.com

- name: Set git signing key
  community.general.git_config:
    name: user.signingkey
    scope: global
    value: 1F460E4716149438

- name: Enable commit signing
  community.general.git_config:
    name: commit.gpgsign
    scope: global
    value: "true"

- name: Set default branch to main
  community.general.git_config:
    name: init.defaultbranch
    scope: global
    value: main
