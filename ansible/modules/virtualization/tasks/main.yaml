---
- name: Install virtualization packages
  become: true
  ansible.builtin.dnf:
    name:
      - libvirt-daemon-kvm
      - gnome-boxes

- name: Add libvirt group membership for {{ target_user }}
  become: true
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: libvirt
    append: true
