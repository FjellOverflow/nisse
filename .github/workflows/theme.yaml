---
name: theme

on:
  push:
    paths:
      - "theme/**"
      - ".github/workflows/theme.yaml"
  pull_request:
    paths:
      - "theme/**"
      - ".github/workflows/theme.yaml"
  workflow_dispatch:

defaults:
  run:
    working-directory: theme

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install --yes jq shellcheck
      - run: ./build.sh
      - run: ./scripts/test-install.sh
      - run: shellcheck build.sh scripts/*.sh
      - run: ./scripts/check-shell-selectors.sh
