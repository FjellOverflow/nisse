---
name: theme-release

on:
  push:
    tags:
      - "theme-v*"

permissions:
  contents: write

defaults:
  run:
    working-directory: theme

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install --yes jq
      - run: ./build.sh
      - name: Package theme
        run: |
          tar -czf nordix-theme.tar.gz -C dist nordix-theme
          sha256sum nordix-theme.tar.gz > nordix-theme.tar.gz.sha256
      - name: Publish release
        run: |
          awk -v heading="## $GITHUB_REF_NAME " 'index($0, heading) == 1 { found = 1; next } found && /^- - -/ { exit } found' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" nordix-theme.tar.gz nordix-theme.tar.gz.sha256 --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
